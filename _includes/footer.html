<footer style="padding: 50px 15px; border-top: 1px solid #2f3245; text-align: center; background: #13141c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 100%; overflow-x: hidden; box-sizing: border-box;">
  
  <div style="margin-bottom: 25px;">
    <strong style="color: #00f0ff; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px;">{{ site.title }}</strong><br>
    <a href="mailto:{{ site.email }}" style="color: #94a3b8; text-decoration: none; font-size: 14px; transition: color 0.2s;" onmouseover="this.style.color='#00f0ff'" onmouseout="this.style.color='#94a3b8'">{{ site.email }}</a>
  </div>
  
  <div class="footer-etsy-link" style="margin-bottom: 30px; text-align: center;">
    <a href="https://studioers.etsy.com" 
       target="_blank" 
       rel="noopener noreferrer" 
       style="display: inline-flex; align-items: center; background: #242632; color: #00f0ff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; border: 1px solid #2f3245; box-shadow: 0 4px 0 #1a1b23; text-transform: uppercase; font-size: 13px; transition: all 0.1s ease;"
       onmouseover="this.style.borderColor='#00f0ff'; this.style.backgroundColor='#1a1b23';" 
       onmouseout="this.style.borderColor='#2f3245'; this.style.backgroundColor='#242632';">
       <span style="font-size: 1.2em; margin-right: 8px;">🎨</span>
       Visit Digital Asset Shop (Etsy)
    </a>
  </div>
  
  <div style="margin-top: 20px; font-size: 14px;">
    <a href="/about" style="margin: 0 12px; color: #94a3b8; text-decoration: none; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;" onmouseover="this.style.color='#ff007a'" onmouseout="this.style.color='#94a3b8'">About</a>
    <a href="/contact" style="margin: 0 12px; color: #94a3b8; text-decoration: none; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;" onmouseover="this.style.color='#ff007a'" onmouseout="this.style.color='#94a3b8'">Contact</a>
    <a href="/privacy" style="margin: 0 12px; color: #94a3b8; text-decoration: none; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;" onmouseover="this.style.color='#ff007a'" onmouseout="this.style.color='#94a3b8'">Privacy Policy</a>
  </div>

  <p style="margin-top: 30px; font-size: 11px; color: #4e5268; letter-spacing: 0.5px; text-transform: uppercase;">
    &copy; 2026 Studioers - Built with passion inside Iveco M23. All Rights Reserved.
  </p>
</footer>
