title: Studioers Arcade
email: coinkriptobilgi@gmail.com
description: >-
  Play free web games, build your virtual mining power, and earn real cryptocurrency instantly! Fast payouts via FaucetPay.
url: "https://studioers.xyz"
baseurl: ""

# İngilizceye çevirdiğimiz için eski Türkçe sayfaları (yazilar.md gibi) menüden kaldırdık
header_pages:
  - studioblast.md
  - ai-art.md

# En stabil ve hatasız tema
theme: minima

encoding: "utf-8"

# Markdown ayarları
markdown: kramdown
highlighter: rouge

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Google indekslemesini uçuracak eklentiler (SEO ve Sitemap aktif)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - admin/
  - node_modules/
  - vendor/
  - backup/

# Stil SCSS'i okuması için ayarlar
sass:
  sass_dir: _sass
  style: compressed
